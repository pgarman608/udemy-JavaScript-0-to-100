<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Canvas</title>

        <style>
            /*
            
                Al canvas generado en el body le pondremos un color de fondo 
                y un borde para diferenciarlo.
            
            */
            #canvas{

                background-color: cyan;
                border: solid yellow 3px;

            }

        </style>

        <script>
            
            let canvas,imgSelect;
            
            window.addEventListener("load",(event)=>{

                let select = document.getElementById("archImagenes"); 
                canvas = document.getElementById("canvas");
                // Comprobamos que podemos acceder al canvas.
                if (canvas && canvas.getContext) {
                    // Recogeremos el contenido 2d del canvas.
                    let ctx = canvas.getContext("2d");

                    if (ctx) {

                        //Aqui veremos como podemos cargar una imagen desde el html al canvas de JavaScript.

                        //Tendremos que recoger el dato desde el select.
                        select.onchange = function (event) {
                            imgSelect = new Image();
                            imgSelect.src = "imagenes/" + select.value;

                            //Crearemos la imagen.
                            imgSelect.onload = function(evt) {

                                procesarImagen();

                            };
                        };

                        //Cuando la imagen se carge la imagen limpiaremos el canvas, procesaremos en el canvas.
                        function procesarImagen() {

                            limpiarCanvas();
                            ctx.drawImage(imgSelect,10,10);

                        }

                        //Limpiaremos el camva de JavaScript
                        function limpiarCanvas() {

                            ctx.clearRect(0,0,canvas.width,canvas.height);

                        }
                    }else{
                        
                        alert("No soporta la etiqueta canvas");

                    }

                }

            });

        </script>
    </head>
    <body>
        <!--
        
            La etiqueta canvas nos genera un "lienzo" en el que podemos 
            dibujar graficos y animaciones mediante JavaScript
        
        -->
        <canvas id="canvas" width="600" height="400">

        </canvas>
        Imagen: 
        <select name="imagenes" id="archImagenes">
            <option value="" selected disabled hidden>Seleccione una imagen</option>
            <option value="atenea.png">Atenea</option>
            <option value="afrodita.png">Afrodita</option>
            <option value="grito.png">Grito</option>
            <option value="klimt.jpeg">Klimt</option>
            <option value="vanGogh.png">Van Gogh</option>
        </select>
    </body>
</html>
