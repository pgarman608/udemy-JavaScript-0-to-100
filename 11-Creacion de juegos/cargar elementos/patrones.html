<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Canvas</title>

        <style>
            /*
            
                Al canvas generado en el body le pondremos un color de fondo 
                y un borde para diferenciarlo.
            
            */
            #canvas{

                background-color: cyan;
                border: solid yellow 3px;

            }

        </style>

        <script>
            
            let canvas;
            window.addEventListener("load",(event)=>{

                canvas = document.getElementById("canvas");
                // Comprobamos que podemos acceder al canvas.
                if (canvas && canvas.getContext) {
                    // Recogeremos el contenido 2d del canvas.
                    let ctx = canvas.getContext("2d");

                    if (ctx) {

                        //Aqui veremos como podemos crear un patron a partir de 
                        //una imagen en canvas de JavaScript.

                        //Crearemos la imagen para el patron.
                        let imgBola = new Image();
                        imgBola.src ="bola.png";

                        //Cuando la imagen se carge crearemos un patron que se repita.
                        imgBola.onload = function(evt) {
                            var patron = ctx.createPattern(imgBola, "repeat");

                            //Añadimos el patron al canvas
                            ctx.fillStyle = patron;
                            ctx.fillRect(0,0,canvas.width, canvas.height);
                        };
                    }else{
                        
                        alert("No soporta la etiqueta canvas");

                    }

                }

            });

        </script>
    </head>
    <body>
        <!--
        
            La etiqueta canvas nos genera un "lienzo" en el que podemos 
            dibujar graficos y animaciones mediante JavaScript
        
        -->
        <canvas id="canvas" width="600" height="400">

        </canvas>
    </body>
</html>
