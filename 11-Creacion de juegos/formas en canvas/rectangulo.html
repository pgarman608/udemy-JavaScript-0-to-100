<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Canvas</title>

        <style>
            /*
            
                Al canvas generado en el body le pondremos un color de fondo 
                y un borde para diferenciarlo.
            
            */
            #canvas{

                background-color: cyan;
                border: solid yellow 3px;
            }

        </style>

        <script>
            // Aqui tenemos un objeto para crear el rectangulo
            function Rectangulo(x ,y ,ancho ,alto ,radio ,fondo ,linea, ctx ) {
                //Parametros del rectangulo
                this.x = x;
                this.y = y;
                this.width = ancho;
                this.height = alto;
                this.r = radio;
                this.foreground = fondo;
                this.line = linea;

                this.dibujar = function () {
                    ctx.save();

                    ctx.beginPath();

                    //Ubicacion del rectangulo
                    ctx.moveTo(this.x, this.r + this.y);

                    //Esquina inferior derecha
                    ctx.lineTo(this.x, this.y + this.height - this.r);
                    ctx.quadraticCurveTo(this.x , this.y + this.height , this.x + this.r , this.height + this.y);
                    
                    //Esquina inferior derecha
                    ctx.lineTo(this.x + this.width - this.r, this.y + this.height);
                    ctx.quadraticCurveTo(this.x + this.width, this.y + this.height, this.x + this.width, this.y + this.height - this.r);
                    
                    //Esquina superior derecha
                    ctx.lineTo(this.x + this.width, this.y + this.r);
                    ctx.quadraticCurveTo(this.x + this.width, this.y, this.x + this.width - this.r, this.y);
                    
                    //Esquina superior izquierda
                    ctx.lineTo(this.x + this.r, this.y);
                    ctx.quadraticCurveTo(this.x, this.y, this.x, this.y + this.r);
                    
                    //Estilos del rectangulo
                    ctx.fillStyle = this.foreground;
                    ctx.strokeStyle = this.line;
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
            }

            let canvas;

            window.addEventListener("load",(event)=>{

                canvas = document.getElementById("canvas");
                // Comprobamos que podemos acceder al canvas.
                if (canvas && canvas.getContext) {
                    // Recogeremos el contenido 2d del canvas.
                    let ctx = canvas.getContext("2d");

                    if (ctx) {
                        
                        //Aqui veremos como podemos hacer un rectamgulo en el canvas con JavaScript.
                        
                        //Creo el objeto del Rectangulo y lo dibujo con el metodo creado dentro.

                        let rectangulo = new Rectangulo(30,30, 200, 120,20,"orange", "purple", ctx);
                        rectangulo.dibujar();
                    }else{
                        
                        alert("No soporta la etiqueta canvas");

                    }

                }

            });

        </script>
    </head>
    <body>
        <!--
        
            La etiqueta canvas nos genera un "lienzo" en el que podemos 
            dibujar graficos y animaciones mediante JavaScript
        
        -->
        <canvas id="canvas" width="600" height="400">

        </canvas>
    </body>
</html>
