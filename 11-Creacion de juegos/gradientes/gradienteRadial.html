<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Canvas</title>

        <style>
            /*
            
                Al canvas generado en el body le pondremos un color de fondo 
                y un borde para diferenciarlo.
            
            */
            #canvas{

                background-color: cyan;
                border: solid yellow 3px;

            }

        </style>

        <script>
            
            let canvas;

            window.addEventListener("load",(event)=>{

                canvas = document.getElementById("canvas");
                // Comprobamos que podemos acceder al canvas.
                if (canvas && canvas.getContext) {
                    // Recogeremos el contenido 2d del canvas.
                    let ctx = canvas.getContext("2d");

                    if (ctx) {
                        // Aqui veremos como podemos crear un gradiente radial en el canvas de JavaScript

                        //Crearemos 2 radios para el gradiente
                        let x1 = canvas.width / 2;
                        let y1 = canvas.height / 2;
                        let r1 = 10;

                        let x2 = canvas.width / 2;
                        let y2 = canvas.height / 2;
                        let r2 = 300;

                        //Crearemos el gradiente radial con los dos radios anteriores
                        var gradiente = ctx.createRadialGradient(x1,y1,r1,x2,y2,r2);

                        //Pondremos los colores que queramos al gradiente
                        gradiente.addColorStop(0, "pink");
                        gradiente.addColorStop(0.15, "yellow");
                        gradiente.addColorStop(0.35, "white");
                        gradiente.addColorStop(0.65, "green");
                        gradiente.addColorStop(1, "red");

                        //Añadimos el gradiente al canvas
                        ctx.fillStyle = gradiente;
                        ctx.fillRect(0,0,canvas.width, canvas.height);
                        
                    }else{
                        
                        alert("No soporta la etiqueta canvas");

                    }

                }

            });

        </script>
    </head>
    <body>
        <!--
        
            La etiqueta canvas nos genera un "lienzo" en el que podemos 
            dibujar graficos y animaciones mediante JavaScript
        
        -->
        <canvas id="canvas" width="600" height="400">

        </canvas>
    </body>
</html>
